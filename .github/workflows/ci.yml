name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suite (incl. architecture enforcement)
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel and smoke-test the CLI
        run: |
          pip install -r requirements.txt
          pip install --no-deps dist/*.whl
          python examples/generate_sample.py
          healthhub-metrics examples/glucose_sample.csv -o metrics.json --walk-adherence 0.8
          python -c "import json; d=json.load(open('metrics.json')); assert len(d) == 22; print('CLI smoke OK')"
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: healthhub-dist
          path: dist/*
