name: Weekly Excel export

# §D trigger (c): build HealthOS_500d.xlsx weekly and drop it into a synced folder.
# Lower frequency than the dashboard cron; does NOT publish to Pages. Keep CSV inputs and the
# workbook in a PRIVATE location (this is PHI) — never echo their contents.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .
      - name: Build workbook from the demo fixture (replace with your private CSV step)
        run: |
          python examples/generate_sample.py
          mkdir -p synced
          healthhub-export --csv examples/glucose_sample.csv -o synced/HealthOS_500d.xlsx
          python -c "from openpyxl import load_workbook; load_workbook('synced/HealthOS_500d.xlsx'); print('workbook opens OK')"
      - uses: actions/upload-artifact@v4
        with:
          name: HealthOS_500d
          path: synced/HealthOS_500d.xlsx
