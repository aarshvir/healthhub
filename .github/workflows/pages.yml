name: Cycle → Pages

# Always-on layer (Part 3.2): run the engine every 15 minutes and publish the dashboard.
# Secrets reach the job ONLY as env; cycle.py's leak gate refuses to publish if any secret
# value lands in an artifact. Access-gate the published URL per docs/CLOUD_SETUP.md.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .
      - name: Run cycle → publish/
        env:
          DEXCOM_USERNAME: ${{ secrets.DEXCOM_USERNAME }}
          DEXCOM_PASSWORD: ${{ secrets.DEXCOM_PASSWORD }}
          DEXCOM_REGION: ${{ vars.DEXCOM_REGION }}
          NS_URL: ${{ secrets.NS_URL }}
          NS_TOKEN: ${{ secrets.NS_TOKEN }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          HEALTH_LOG_SHEET_ID: ${{ vars.HEALTH_LOG_SHEET_ID }}
          WEARABLES_SHEET_ID: ${{ vars.WEARABLES_SHEET_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OURA_TOKEN: ${{ secrets.OURA_TOKEN }}
        run: |
          healthhub-cycle --out-dir publish
          cp publish/dashboard.html publish/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
